apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderbook-app
  namespace: default
spec:  
  replicas: 1  
  selector:
    matchLabels:
      app: orderbook-app
  template:
    metadata:
      labels:
        app: orderbook-app
    spec:      
      containers:
      - name: orderbook-app
        image: $imagen
        imagePullPolicy: IfNotPresent             
        ports:
          - containerPort: 8080        
        resources:
          requests:
            memory: "300Mi"  
            cpu: "0.2"       
          limits:
            memory: "500Mi"  
            cpu: "0.3"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
  
